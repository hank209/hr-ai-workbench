<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0F172A">
<title>{% block title %}人事工作台{% endblock %}</title>
<link rel="stylesheet" href="/static/css/app.css">
<script src="/static/vendor/htmx.min.js"></script>
<script src="/static/vendor/alpine.min.js" defer></script>
<script src="/static/js/app.js"></script>
</head>
<body>
<div class="app">

  <!-- 移动端遮罩 -->
  <div class="sidebar-overlay" id="sidebarOverlay" onclick="closeSidebar()"></div>

  <!-- 侧边栏 -->
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 4h7v7H4zM13 4h7v7h-7zM4 13h7v7H4zM13 16.5l2.2 2.2L20 14.5"/>
        </svg>
      </span>
      <span class="brand-text">
        <span class="brand-name">人事工作台</span>
        <span class="brand-sub">HR Workbench</span>
      </span>
    </div>

    <nav class="nav">
      <div class="nav-group">工作台</div>
      <a class="nav-item {{ 'active' if request.url.path == '/' else '' }}" href="/">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8.5 12.2l2.4 2.4 4.6-5"/></svg>待办中心
      </a>

      <div class="nav-group">人事</div>
      <a class="nav-item {{ 'active' if request.url.path.startswith('/employees') else '' }}" href="/employees">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9.5" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>员工档案
      </a>
      <a class="nav-item {{ 'active' if request.url.path.startswith('/checklist') else '' }}" href="/checklist">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 4V3a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v1"/><path d="M9 13l2 2 4-4.5"/></svg>入离职清单
      </a>

      <div class="nav-group">招聘</div>
      <a class="nav-item {{ 'active' if request.url.path.startswith('/resume') else '' }}" href="/resume">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/><path d="M9 13h6"/><path d="M9 17h6"/></svg>简历管理
      </a>
      <a class="nav-item {{ 'active' if request.url.path.startswith('/interviews') else '' }}" href="/interviews">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="7" width="19" height="13" rx="2"/><path d="M9 7V5.5A1.5 1.5 0 0 1 10.5 4h3A1.5 1.5 0 0 1 15 5.5V7"/><path d="M2.5 12.5h19"/></svg>面试安排
      </a>

      <div class="nav-group">合同</div>
      <a class="nav-item {{ 'active' if request.url.path.startswith('/contract') else '' }}" href="/contract">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/><path d="M8 13.5l2-1 4 2 3.5-4"/><path d="M8 17h5"/></svg>合同台账
      </a>

      <div class="nav-group">考勤</div>
      <a class="nav-item {{ 'active' if request.url.path.startswith('/attendance') else '' }}" href="/attendance">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2"/></svg>考勤异常
      </a>
      <a class="nav-item {{ 'active' if request.url.path.startswith('/leave') else '' }}" href="/leave">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4.5" width="18" height="17" rx="2.5"/><path d="M8 2.5v4M16 2.5v4M3 10h18"/></svg>假期计算
      </a>

      <div class="nav-group">薪酬</div>
      <a class="nav-item {{ 'active' if request.url.path.startswith('/salary') else '' }}" href="/salary">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="5" width="19" height="14" rx="2.5"/><path d="M2.5 10h19"/><path d="M6.5 15h4"/></svg>工资答疑
      </a>

      <div class="nav-group">知识工具</div>
      <a class="nav-item {{ 'active' if request.url.path.startswith('/knowledge') else '' }}" href="/knowledge">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>制度知识库
      </a>
      <a class="nav-item {{ 'active' if request.url.path.startswith('/replies') else '' }}" href="/replies">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-8.5 8.5 8.5 8.5 0 0 1-3.8-.9L3 21l1.9-5.7a8.5 8.5 0 1 1 16.1-3.8z"/></svg>常用回复
      </a>
      <a class="nav-item {{ 'active' if request.url.path.startswith('/docgen') else '' }}" href="/docgen">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>文书生成
      </a>
    </nav>

    <div class="sidebar-foot"><span class="dot"></span>本机数据 · 离线可用</div>
  </aside>

  <!-- 主区 -->
  <main class="main">
    <header class="topbar">
      <button class="menu-btn" onclick="toggleSidebar()" aria-label="展开导航">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
      </button>
      <h1 class="page-title">{% block page_title %}{% endblock %}</h1>
      <div class="topbar-right">
        <a class="help-link" href="/help" target="_blank" rel="noopener"
           title="查看使用帮助（在新标签页打开）">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.7.3-1 .9-1 1.6v.4"/><path d="M12 17.2h.01"/></svg>
          <span>查看使用帮助</span>
        </a>
        <span class="role-chip">专员版</span>
        <span class="clock">{{ now.strftime('%Y-%m-%d %H:%M') }}</span>
      </div>
    </header>
    <div class="content">
      {% block content %}{% endblock %}
    </div>
  </main>

</div>
<div class="toast-box"></div>
{% block scripts %}{% endblock %}
</body>
</html>

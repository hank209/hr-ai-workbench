<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0F172A">
<title>登录 - 人事工作台</title>
<link rel="stylesheet" href="/static/css/app.css">
<style>
  /* 登录页专用：深墨蓝渐变背景 + 居中卡片（与主站设计系统一致） */
  .login-page {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    background:
      radial-gradient(720px 360px at 78% -10%, rgba(14, 147, 132, 0.28), transparent 60%),
      radial-gradient(640px 380px at 8% 108%, rgba(30, 42, 71, 0.55), transparent 62%),
      linear-gradient(150deg, #0F172A 0%, #16203A 55%, #1E2A47 100%);
  }
  .login-card {
    width: 100%;
    max-width: 400px;
    background: #FFFFFF;
    border-radius: 16px;
    box-shadow: 0 24px 64px rgba(6, 12, 28, 0.45);
    padding: 36px 34px 30px;
  }
  .login-brand { display: flex; align-items: center; gap: 12px; margin-bottom: 6px; }
  .login-brand .brand-mark {
    width: 42px; height: 42px; border-radius: 12px;
    background: linear-gradient(135deg, var(--brand-500), var(--brand-700));
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 4px 14px rgba(14, 147, 132, 0.4);
  }
  .login-brand svg { width: 22px; height: 22px; stroke: #fff; }
  .login-brand .brand-name { display: block; font-size: 18px; font-weight: 600; color: var(--ink-900); letter-spacing: .5px; }
  .login-brand .brand-sub { display: block; font-size: 12px; color: var(--ink-400); margin-top: 1px; }
  .login-desc { font-size: 13px; color: var(--ink-500); line-height: 1.7; margin: 4px 0 24px; }
  .login-desc .ok { color: var(--success-600); }
  .login-form .form-item { margin-bottom: 16px; }
  .login-form input[type=password] { padding: 11px 13px; font-size: 14px; }
  .login-form .btn-primary { width: 100%; padding: 11px; font-size: 14px; }
  .login-error {
    background: var(--danger-50); border: 1px solid var(--danger-100);
    color: var(--danger-700); border-radius: var(--r-md);
    padding: 9px 12px; font-size: 13px; margin-bottom: 14px; line-height: 1.6;
  }
  .login-foot { margin-top: 20px; text-align: center; font-size: 12px; color: var(--ink-400); }
</style>
</head>
<body class="login-page">
  <div class="login-card">
    <div class="login-brand">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 4h7v7H4zM13 4h7v7h-7zM4 13h7v7H4zM13 16.5l2.2 2.2L20 14.5"/>
        </svg>
      </span>
      <span>
        <span class="brand-name">人事工作台</span>
        <span class="brand-sub">HR Workbench</span>
      </span>
    </div>
    <p class="login-desc">输入访问口令进入工作台<br><span class="ok">数据仅保存在本机</span>，不会上传到任何服务器</p>

    {% if err %}<div class="login-error">口令错误，请重试</div>{% endif %}

    <form class="login-form" method="post" action="/api/login">
      <div class="form-item">
        <input type="password" name="password" placeholder="请输入访问口令" autofocus autocomplete="current-password">
      </div>
      <button class="btn btn-primary" type="submit">进入工作台</button>
    </form>

    <div class="login-foot">人事工作台 · 本机绿色版</div>
  </div>
</body>
</html>
